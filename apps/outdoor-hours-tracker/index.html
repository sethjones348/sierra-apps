<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outdoor Hours</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="/sierra-apps/shared/config.js"></script>
  <script src="/sierra-apps/shared/google-drive-storage.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      background: #FAF8F5;
      color: #2C2C2C;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 70px;
    }

    /* Bottom nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #FAF8F5;
      border-top: 1px solid #E8E4DF;
      display: flex;
      justify-content: center;
      gap: 0;
      z-index: 50;
      padding: 0;
    }

    .nav-item {
      flex: 1;
      max-width: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      padding: 0.6rem 0 0.5rem;
      text-decoration: none;
      color: #8A8478;
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 400;
      transition: color 0.2s ease;
      min-height: 44px;
      justify-content: center;
    }

    .nav-item.active {
      color: #2C2C2C;
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
      stroke-width: 1.5;
    }

    header {
      padding: 2.5rem 1.5rem 1.5rem;
      text-align: center;
      border-bottom: 1px solid #E8E4DF;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-size: 1.6rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    header p {
      color: #8A8478;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 400;
      margin-top: 0.3rem;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 0 1.5rem 2rem;
    }

    /* Auth section */
    .auth-section {
      text-align: center;
      padding: 1.2rem 0;
      border-bottom: 1px solid #E8E4DF;
    }

    /* Total summary */
    .total-section {
      text-align: center;
      padding: 2.5rem 0 2rem;
      border-bottom: 1px solid #E8E4DF;
    }

    .total-label {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #8A8478;
      font-weight: 400;
      margin-bottom: 0.5rem;
    }

    .total-hours {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: #2C2C2C;
    }

    .total-hours span {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 300;
      color: #8A8478;
      letter-spacing: 0.05em;
    }

    .week-summary {
      margin-top: 0.8rem;
      font-size: 0.8rem;
      color: #A3A88E;
      letter-spacing: 0.05em;
    }

    /* Stopwatch */
    .stopwatch-section {
      padding: 2rem 0;
      text-align: center;
      border-bottom: 1px solid #E8E4DF;
    }

    .section-title {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #8A8478;
      font-weight: 400;
      margin-bottom: 1.5rem;
    }

    .stopwatch-display {
      font-family: 'DM Sans', sans-serif;
      font-size: 2.8rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      color: #2C2C2C;
      margin-bottom: 1.5rem;
    }

    .stopwatch-buttons {
      display: flex;
      justify-content: center;
      gap: 1rem;
    }

    .btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      border: 1px solid #2C2C2C;
      background: transparent;
      color: #2C2C2C;
      padding: 0.75rem 2rem;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s ease;
      min-width: 120px;
      min-height: 44px;
    }

    .btn:active { opacity: 0.6; }

    .btn-primary {
      background: #2C2C2C;
      color: #FAF8F5;
    }

    .btn-primary:active { background: #444; }

    .btn-save {
      border-color: #A3A88E;
      color: #A3A88E;
    }

    .btn-save:active {
      background: #A3A88E;
      color: #FAF8F5;
    }

    .btn-danger {
      border-color: #C4A68A;
      color: #C4A68A;
    }

    .btn-danger:active {
      background: #C4A68A;
      color: #FAF8F5;
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    /* Log past hours */
    .log-section {
      padding: 2rem 0;
      border-bottom: 1px solid #E8E4DF;
    }

    .log-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .input-group label {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #8A8478;
      font-weight: 400;
    }

    .input-group input {
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 300;
      padding: 0.6rem 0;
      border: none;
      border-bottom: 1px solid #D5D0CA;
      background: transparent;
      color: #2C2C2C;
      outline: none;
      transition: border-color 0.2s ease;
      min-height: 44px;
    }

    .input-group input:focus { border-bottom-color: #2C2C2C; }

    .log-btn-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 0.5rem;
    }

    /* History */
    .history-section {
      padding: 2rem 0 1rem;
    }

    .history-list { margin-top: 1rem; }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
      border-bottom: 1px solid #E8E4DF;
    }

    .history-date {
      font-size: 0.85rem;
      color: #2C2C2C;
      font-weight: 400;
    }

    .history-note {
      font-size: 0.75rem;
      color: #8A8478;
      margin-top: 0.15rem;
    }

    .history-duration {

      font-size: 0.95rem;
      font-weight: 400;
      color: #2C2C2C;
      white-space: nowrap;

    .history-empty {
      text-align: center;
      color: #8A8478;
      font-size: 0.85rem;
      padding: 2rem 0;
    }

    .history-item-left {
      flex: 1;
      min-width: 0;
    }

    .history-item-right {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-left: 1rem;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #C4A68A;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0.3rem;
      font-family: 'DM Sans', sans-serif;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s ease;
    }

    .delete-btn:active { opacity: 0.5; }

    .clear-all-row {
      text-align: center;
      margin-top: 1.5rem;
    }

    .clear-all-btn {
      font-family: 'DM Sans', sans-serif;
      background: none;
      border: none;
      color: #C4A68A;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0.5rem 1rem;
      min-height: 44px;
      transition: opacity 0.2s ease;
    }

    .clear-all-btn:active { opacity: 0.5; }

    /* Bulk add */
    .bulk-section {
      padding: 2rem 0;
      border-bottom: 1px solid #E8E4DF;
      text-align: center;
    }

    .bulk-modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(44, 44, 44, 0.4);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .bulk-modal-overlay.open {
      display: flex;
    }

    .bulk-modal {
      background: #FAF8F5;
      border-radius: 12px;
      padding: 2rem 1.5rem;
      width: 100%;
      max-width: 420px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .bulk-modal h2 {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-size: 1.2rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .bulk-form {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .bulk-row {
      display: flex;
      gap: 1rem;
    }

    .bulk-row .input-group { flex: 1; }

    .bulk-preview {
      font-size: 0.8rem;
      color: #8A8478;
      text-align: center;
      padding: 0.8rem 0;
      letter-spacing: 0.03em;
    }

    .bulk-btn-row {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 0.5rem;
    }

    /* Add photo */
    .photo-section {
      padding: 2rem 0;
      border-bottom: 1px solid #E8E4DF;
      text-align: center;
    }

    .photo-input { display: none; }

    .photo-preview-row {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      margin-top: 1.2rem;
    }

    .photo-preview-row.has-photo { display: flex; }

    .photo-preview-img {
      width: 100%;
      max-width: 300px;
      border-radius: 8px;
    }

    .photo-meta {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 300px;
    }

    .photo-btn-row {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    .photo-btn-row .btn { min-width: 100px; }

    /* Back link */
    .back-link {
      display: inline-block;
      color: #8A8478;
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 1rem 1.5rem;
      transition: opacity 0.2s ease;
    }

    .back-link:active { opacity: 0.5; }
  </style>
  <style id="gds-styles"></style>
</head>
<body>
  <header>
    <h1>Outdoor Hours</h1>
    <p>Time well spent</p>
  </header>

  <div class="container">
    <!-- Auth -->
    <div class="auth-section" id="authSection"></div>

    <!-- Total -->
    <div class="total-section">
      <div class="total-label">All Time Total</div>
      <div class="total-hours" id="totalDisplay">0<span> hrs</span></div>
      <div class="week-summary" id="weekSummary">0 hrs this week</div>
    </div>

    <!-- Stopwatch -->
    <div class="stopwatch-section">
      <div class="section-title">Stopwatch</div>
      <div class="stopwatch-display" id="stopwatchDisplay">00:00:00</div>
      <div class="stopwatch-buttons">
        <button class="btn btn-primary" id="startStopBtn" onclick="toggleStopwatch()">Start</button>
        <button class="btn btn-save" id="saveBtn" onclick="saveStopwatch()" disabled>Save</button>
        <button class="btn btn-danger" id="resetBtn" onclick="resetStopwatch()" disabled>Reset</button>
      </div>
    </div>

    <!-- Log past hours -->
    <div class="log-section">
      <div class="section-title">Log Past Hours</div>
      <div class="log-form">
        <div class="input-group">
          <label>Date</label>
          <input type="date" id="logDate">
        </div>
        <div class="input-group">
          <label>Hours</label>
          <input type="number" id="logHours" placeholder="e.g. 2.5" min="0" step="0.25">
        </div>
        <div class="input-group">
          <label>Note (optional)</label>
          <input type="text" id="logNote" placeholder="e.g. Park walk">
        </div>
        <div class="log-btn-row">
          <button class="btn" onclick="logPastHours()">Add Entry</button>
        </div>
      </div>
    </div>

    <!-- Bulk add -->
    <div class="bulk-section">
      <div class="section-title">Backfill Previous Months</div>
      <button class="btn" onclick="openBulkModal()">Bulk Add Hours</button>
    </div>

    <!-- Bulk modal -->
    <div class="bulk-modal-overlay" id="bulkOverlay" onclick="closeBulkModal(event)">
      <div class="bulk-modal" onclick="event.stopPropagation()">
        <h2>Bulk Add Hours</h2>
        <div class="bulk-form">
          <div class="bulk-row">
            <div class="input-group">
              <label>From Month</label>
              <input type="month" id="bulkFrom">
            </div>
            <div class="input-group">
              <label>To Month</label>
              <input type="month" id="bulkTo">
            </div>
          </div>
          <div class="input-group">
            <label>Hours per Month</label>
            <input type="number" id="bulkHours" placeholder="e.g. 20" min="0" step="0.25">
          </div>
          <div class="input-group">
            <label>Note (optional)</label>
            <input type="text" id="bulkNote" placeholder="e.g. Estimated outdoor time">
          </div>
          <div class="bulk-preview" id="bulkPreview"></div>
          <div class="bulk-btn-row">
            <button class="btn btn-danger" onclick="closeBulkModal()">Cancel</button>
            <button class="btn btn-primary" onclick="submitBulk()">Add All</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Add photo -->
    <div class="photo-section">
      <div class="section-title">Capture a Moment</div>
      <button class="btn" onclick="document.getElementById('photoInput').click()">Add Photo</button>
      <input type="file" accept="image/*" capture="environment" id="photoInput" class="photo-input" onchange="handlePhotoSelect(event)">
      <div class="photo-preview-row" id="photoPreviewRow">
        <img id="photoPreviewImg" class="photo-preview-img" src="" alt="Preview">
        <div class="photo-meta">
          <div class="input-group">
            <label>Date</label>
            <input type="date" id="photoDate">
          </div>
          <div class="input-group">
            <label>Caption (optional)</label>
            <input type="text" id="photoCaption" placeholder="e.g. Sunset at the lake">
          </div>
          <div class="photo-btn-row">
            <button class="btn btn-danger" onclick="cancelPhoto()">Cancel</button>
            <button class="btn btn-primary" onclick="savePhoto()">Save</button>
          </div>
        </div>
      </div>
    </div>

    <!-- History -->
    <div class="history-section">
      <div class="section-title">History</div>
      <div class="history-list" id="historyList">
        <div class="history-empty">No entries yet</div>
      </div>
      <div class="clear-all-row" id="clearAllRow" style="display:none;">
        <button class="clear-all-btn" onclick="clearAll()">Clear All History</button>
      </div>
    </div>
  </div>

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <a href="/sierra-apps/" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0h4"/></svg>
      Home
    </a>
    <a href="/sierra-apps/apps/outdoor-hours-tracker/" class="nav-item active">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      Tracker
    </a>
    <a href="/sierra-apps/apps/outdoor-hours-tracker/album.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      Album
    </a>
  </nav>

  <script>
    // --- State ---
    let entries = [];
    let stopwatchInterval = null;
    let stopwatchStartTime = null;
    let stopwatchElapsed = 0;
    let stopwatchRunning = false;

    // --- Google Drive Storage ---
    const storage = new GoogleDriveStorage('outdoor-hours-data.json', 'outdoor-hours-data');

    // Inject shared auth styles
    document.getElementById('gds-styles').textContent = GoogleDriveStorage.getStyles();

    // Render auth UI
    storage.renderAuthUI(document.getElementById('authSection'), {
      onSignIn: async () => {
        entries = await storage.syncFromDrive(entries, mergeEntries);
        renderAll();
      },
      onSignOut: () => {}
    });

    function mergeEntries(local, remote) {
      if (!Array.isArray(remote)) return local || [];
      const map = new Map();
      (remote || []).forEach(e => map.set(e.id, e));
      (local || []).forEach(e => map.set(e.id, e));
      return Array.from(map.values()).sort((a, b) => {
        if (a.date !== b.date) return b.date.localeCompare(a.date);
        return b.id - a.id;
      });
    }

    function saveData() {
      storage.save(entries);
    }

    // --- Stopwatch ---
    function toggleStopwatch() {
      if (stopwatchRunning) pauseStopwatch();
      else startStopwatch();
    }

    function startStopwatch() {
      stopwatchRunning = true;
      stopwatchStartTime = Date.now() - stopwatchElapsed;
      stopwatchInterval = setInterval(updateStopwatchDisplay, 100);
      document.getElementById('startStopBtn').textContent = 'Pause';
      document.getElementById('saveBtn').disabled = false;
      document.getElementById('resetBtn').disabled = false;
    }

    function pauseStopwatch() {
      stopwatchRunning = false;
      stopwatchElapsed = Date.now() - stopwatchStartTime;
      clearInterval(stopwatchInterval);
      document.getElementById('startStopBtn').textContent = 'Resume';
      document.getElementById('saveBtn').disabled = false;
      document.getElementById('resetBtn').disabled = false;
    }

    function resetStopwatch() {
      stopwatchRunning = false;
      stopwatchElapsed = 0;
      stopwatchStartTime = null;
      clearInterval(stopwatchInterval);
      document.getElementById('stopwatchDisplay').textContent = '00:00:00';
      document.getElementById('startStopBtn').textContent = 'Start';
      document.getElementById('saveBtn').disabled = true;
      document.getElementById('resetBtn').disabled = true;
    }

    function saveStopwatch() {
      const elapsed = stopwatchRunning
        ? Date.now() - stopwatchStartTime
        : stopwatchElapsed;

      if (elapsed < 1000) return;

      const hours = elapsed / 3600000;
      const today = new Date().toISOString().slice(0, 10);

      entries.unshift({
        id: Date.now(),
        date: today,
        hours: Math.round(hours * 100) / 100,
        note: 'Stopwatch'
      });

      saveData();
      renderAll();
      resetStopwatch();
    }

    function updateStopwatchDisplay() {
      const elapsed = Date.now() - stopwatchStartTime;
      const totalSec = Math.floor(elapsed / 1000);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      document.getElementById('stopwatchDisplay').textContent =
        pad(h) + ':' + pad(m) + ':' + pad(s);
    }

    function pad(n) {
      return n.toString().padStart(2, '0');
    }

    // --- Log past hours ---
    function logPastHours() {
      const dateInput = document.getElementById('logDate');
      const hoursInput = document.getElementById('logHours');
      const noteInput = document.getElementById('logNote');

      const date = dateInput.value;
      const hours = parseFloat(hoursInput.value);

      if (!date || isNaN(hours) || hours <= 0) return;

      entries.unshift({
        id: Date.now(),
        date: date,
        hours: Math.round(hours * 100) / 100,
        note: noteInput.value.trim() || ''
      });

      saveData();
      renderAll();

      hoursInput.value = '';
      noteInput.value = '';
    }

    // --- Delete ---
    function deleteEntry(id) {
      entries = entries.filter(e => e.id !== id);
      saveData();
      renderAll();
    }

    function clearAll() {
      if (confirm('Clear all history? This cannot be undone.')) {
        entries = [];
        saveData();
        renderAll();
      }
    }

    // --- Rendering ---
    function renderAll() {
      renderTotal();
      renderWeekSummary();
      renderHistory();
    }

    function renderTotal() {
      const total = entries.reduce((sum, e) => sum + e.hours, 0);
      const display = total < 10
        ? total.toFixed(1)
        : Math.round(total).toString();
      document.getElementById('totalDisplay').innerHTML =
        display + '<span> hrs</span>';
    }

    function renderWeekSummary() {
      const now = new Date();
      const dayOfWeek = now.getDay();
      const startOfWeek = new Date(now);
      startOfWeek.setDate(now.getDate() - dayOfWeek);
      startOfWeek.setHours(0, 0, 0, 0);
      const startStr = startOfWeek.toISOString().slice(0, 10);

      const weekTotal = entries
        .filter(e => e.date >= startStr)
        .reduce((sum, e) => sum + e.hours, 0);

      document.getElementById('weekSummary').textContent =
        (weekTotal < 10 ? weekTotal.toFixed(1) : Math.round(weekTotal)) + ' hrs this week';
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      const clearRow = document.getElementById('clearAllRow');

      if (entries.length === 0) {
        list.innerHTML = '<div class="history-empty">No entries yet</div>';
        clearRow.style.display = 'none';
        return;
      }

      clearRow.style.display = 'block';

      list.innerHTML = entries.map(e => {
        const dateObj = new Date(e.date + 'T12:00:00');
        const formatted = dateObj.toLocaleDateString('en-US', {
          month: 'short', day: 'numeric', year: 'numeric'
        });
        const hoursStr = e.hours < 1
          ? Math.round(e.hours * 60) + ' min'
          : e.hours.toFixed(1) + ' hrs';
        const noteHtml = e.note
          ? '<div class="history-note">' + escapeHtml(e.note) + '</div>'
          : '';

        return '<div class="history-item">' +
          '<div class="history-item-left">' +
            '<div class="history-date">' + formatted + '</div>' +
            noteHtml +
          '</div>' +
          '<div class="history-item-right">' +
            '<div class="history-duration">' + hoursStr + '</div>' +
            '<button class="delete-btn" onclick="deleteEntry(' + e.id + ')">&times;</button>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // --- Bulk add ---
    function openBulkModal() {
      const now = new Date();
      const lastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
      const formatMonth = d => d.toISOString().slice(0, 7);
      document.getElementById('bulkFrom').value = formatMonth(lastMonth);
      document.getElementById('bulkTo').value = formatMonth(lastMonth);
      document.getElementById('bulkHours').value = '';
      document.getElementById('bulkNote').value = '';
      updateBulkPreview();
      document.getElementById('bulkOverlay').classList.add('open');
    }

    function closeBulkModal(e) {
      if (e && e.target !== document.getElementById('bulkOverlay')) return;
      document.getElementById('bulkOverlay').classList.remove('open');
    }

    function getMonthsBetween(from, to) {
      const months = [];
      const [fy, fm] = from.split('-').map(Number);
      const [ty, tm] = to.split('-').map(Number);
      let y = fy, m = fm;
      while (y < ty || (y === ty && m <= tm)) {
        months.push({ year: y, month: m });
        m++;
        if (m > 12) { m = 1; y++; }
      }
      return months;
    }

    function updateBulkPreview() {
      const from = document.getElementById('bulkFrom').value;
      const to = document.getElementById('bulkTo').value;
      const hours = parseFloat(document.getElementById('bulkHours').value);
      const preview = document.getElementById('bulkPreview');

      if (!from || !to || from > to) {
        preview.textContent = '';
        return;
      }

      const months = getMonthsBetween(from, to);
      const count = months.length;
      const total = isNaN(hours) || hours <= 0 ? 0 : hours * count;
      preview.textContent = count + ' month' + (count !== 1 ? 's' : '') +
        (total > 0 ? ' — ' + total + ' hrs total' : '');
    }

    // Update preview when inputs change
    document.getElementById('bulkFrom').addEventListener('input', updateBulkPreview);
    document.getElementById('bulkTo').addEventListener('input', updateBulkPreview);
    document.getElementById('bulkHours').addEventListener('input', updateBulkPreview);

    function submitBulk() {
      const from = document.getElementById('bulkFrom').value;
      const to = document.getElementById('bulkTo').value;
      const hours = parseFloat(document.getElementById('bulkHours').value);
      const note = document.getElementById('bulkNote').value.trim();

      if (!from || !to || from > to) return;
      if (isNaN(hours) || hours <= 0) return;

      const months = getMonthsBetween(from, to);

      months.forEach(({ year, month }) => {
        // Use the 15th of each month as the entry date
        const date = year + '-' + String(month).padStart(2, '0') + '-15';
        entries.unshift({
          id: Date.now() + Math.random(),
          date: date,
          hours: Math.round(hours * 100) / 100,
          note: note || 'Bulk entry'
        });
      });

      // Sort entries by date descending
      entries.sort((a, b) => {
        if (a.date !== b.date) return b.date.localeCompare(a.date);
        return b.id - a.id;
      });

      saveData();
      renderAll();
      document.getElementById('bulkOverlay').classList.remove('open');
    }

    // --- Photo storage ---
    const photoStorage = new GoogleDriveStorage('outdoor-hours-photos.json', 'outdoor-hours-photos');
    let photos = [];
    let pendingPhotoData = null;

    function resizeImage(file, maxWidth, callback) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let w = img.width, h = img.height;
          if (w > maxWidth) {
            h = Math.round(h * maxWidth / w);
            w = maxWidth;
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL('image/jpeg', 0.7));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function handlePhotoSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      resizeImage(file, 800, function(dataUrl) {
        pendingPhotoData = dataUrl;
        document.getElementById('photoPreviewImg').src = dataUrl;
        document.getElementById('photoPreviewRow').classList.add('has-photo');
        document.getElementById('photoDate').value = new Date().toISOString().slice(0, 10);
        document.getElementById('photoCaption').value = '';
      });
    }

    function cancelPhoto() {
      pendingPhotoData = null;
      document.getElementById('photoPreviewRow').classList.remove('has-photo');
      document.getElementById('photoInput').value = '';
    }

    function savePhoto() {
      if (!pendingPhotoData) return;
      const date = document.getElementById('photoDate').value || new Date().toISOString().slice(0, 10);
      const caption = document.getElementById('photoCaption').value.trim();
      photos.unshift({
        id: Date.now() + Math.random(),
        date: date,
        dataUrl: pendingPhotoData,
        caption: caption
      });
      photos.sort((a, b) => {
        if (a.date !== b.date) return b.date.localeCompare(a.date);
        return b.id - a.id;
      });
      photoStorage.save(photos);
      cancelPhoto();
    }

    // --- Init ---
    (function init() {
      const today = new Date().toISOString().slice(0, 10);
      document.getElementById('logDate').value = today;

      entries = storage.loadLocal() || [];
      photos = photoStorage.loadLocal() || [];
      renderAll();
    })();
  </script>
</body>
</html>

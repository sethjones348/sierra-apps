  <link rel="apple-touch-icon" id="appleTouchIcon" href="/sierra-apps/apps/outdoor-hours-tracker/icon.svg">
  <script>
    // Generate PNG apple-touch-icon from canvas for iOS
    (function() {
      var c = document.createElement('canvas');
      c.width = 180; c.height = 180;
      var x = c.getContext('2d');
      // Cream background with rounded corners (iOS clips automatically)
      x.fillStyle = '#FAF8F5';
      x.fillRect(0, 0, 180, 180);
      // Sun body - light warm yellow
      x.beginPath();
      x.arc(90, 88, 42, 0, Math.PI * 2);
      x.fillStyle = '#F6E6A0';
      x.fill();
      // Sun rays
      x.strokeStyle = '#F6E6A0';
      x.lineWidth = 3.5;
      x.lineCap = 'round';
      var rays = 10;
      for (var i = 0; i < rays; i++) {
        var angle = (i / rays) * Math.PI * 2 - Math.PI / 2;
        var x1 = 90 + Math.cos(angle) * 48;
        var y1 = 88 + Math.sin(angle) * 48;
        var x2 = 90 + Math.cos(angle) * 60;
        var y2 = 88 + Math.sin(angle) * 60;
        x.beginPath();
        x.moveTo(x1, y1);
        x.lineTo(x2, y2);
        x.stroke();
      }
      // Happy closed eyes - curved arcs
      x.strokeStyle = '#8A7A60';
      x.lineWidth = 2.5;
      x.lineCap = 'round';
      // Left eye
      x.beginPath();
      x.arc(77, 83, 7, Math.PI * 1.15, Math.PI * 1.85);
      x.stroke();
      // Right eye
      x.beginPath();
      x.arc(103, 83, 7, Math.PI * 1.15, Math.PI * 1.85);
      x.stroke();
      // Happy smile
      x.beginPath();
      x.arc(90, 92, 14, Math.PI * 0.15, Math.PI * 0.85);
      x.stroke();
      // Rosy cheeks
      x.fillStyle = 'rgba(212, 170, 140, 0.35)';
      x.beginPath(); x.arc(68, 96, 7, 0, Math.PI * 2); x.fill();
      x.beginPath(); x.arc(112, 96, 7, 0, Math.PI * 2); x.fill();
      // Set as apple-touch-icon
      try {
        var link = document.getElementById('appleTouchIcon');
        link.href = c.toDataURL('image/png');
      } catch(e) {}
    })();
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      background: #FAF8F5;
      color: #2C2C2C;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 70px;
    }

    /* Bottom nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #FAF8F5;
      border-top: 1px solid #E8E4DF;
      display: flex;
      justify-content: center;
      gap: 0;
      z-index: 50;
      padding: 0;
    }

    .nav-item {
      flex: 1;
      max-width: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      padding: 0.6rem 0 0.5rem;
      text-decoration: none;
      color: #8A8478;
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 400;
      transition: color 0.2s ease;
      min-height: 44px;
      justify-content: center;
    }

    .nav-item.active {
      color: #2C2C2C;
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
      stroke-width: 1.5;
    }

    header {
      padding: 2.5rem 1.5rem 1.5rem;
      text-align: center;
      border-bottom: 1px solid #E8E4DF;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-size: 1.6rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    header p {
      color: #8A8478;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 400;
      margin-top: 0.3rem;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 0 1.5rem 2rem;
    }

    /* Auth section */
    .auth-section {
      text-align: center;
      padding: 1.2rem 0;
      border-bottom: 1px solid #E8E4DF;
    }

    /* Total summary */
    .total-section {
      text-align: center;
      padding: 2.5rem 0 2rem;
      border-bottom: 1px solid #E8E4DF;
    }

    .total-label {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #8A8478;
      font-weight: 400;
      margin-bottom: 0.5rem;
    }

    .total-hours {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: #2C2C2C;
    }

    .total-hours span {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 300;
      color: #8A8478;
      letter-spacing: 0.05em;
    }

    .week-summary {
      margin-top: 0.8rem;
      font-size: 0.8rem;
      color: #A3A88E;
      letter-spacing: 0.05em;
    }

    /* Stopwatch */
    .stopwatch-section {
      padding: 2rem 0;
      text-align: center;
      border-bottom: 1px solid #E8E4DF;
    }

    .section-title {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #8A8478;
      font-weight: 400;
      margin-bottom: 1.5rem;
    }

    .stopwatch-display {
      font-family: 'DM Sans', sans-serif;
      font-size: 2.8rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      color: #2C2C2C;
      margin-bottom: 1.5rem;
    }

    .stopwatch-buttons {
      display: flex;
      justify-content: center;
      gap: 1rem;
    }

    .btn {

      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;

      color: #2C2C2C;

      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s ease;

      min-height: 44px;

      color: #FAF8F5;
    }

    .btn-primary:active { background: #444; }

    .btn-save {
      border-color: #A3A88E;
      color: #A3A88E;
    }

    .btn-save:active {

      color: #FAF8F5;
    }

      border-color: #C4A68A;
      color: #C4A68A;
    }

    .btn-danger:active {
      background: #C4A68A;
      color: #FAF8F5;
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    /* Log entry */
    .log-section {
      padding: 2rem 0;
      border-bottom: 1px solid #E8E4DF;
    }

    .log-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .entry-photo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
      padding: 1rem 0 0.5rem;
    }

    .entry-photo-buttons {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
    }

    .entry-photo-buttons .btn {
      font-size: 0.65rem;
      padding: 0.5rem 1.2rem;
      min-width: auto;
    }

    .entry-photo-preview {

      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      width: 100%;
    }

    .entry-photo-preview.has-photo { display: flex; }

    .entry-photo-preview img {
      width: 100%;
      max-width: 260px;
      border-radius: 8px;
    }

    .entry-photo-caption {
      width: 100%;
      max-width: 260px;
    }

    .entry-photo-remove {
      background: none;
      border: none;
      color: #C4A68A;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0.3rem;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .entry-photo-remove:active { opacity: 0.5; }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .input-group label {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #8A8478;
      font-weight: 400;
    }

    .input-group input {
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 300;
      padding: 0.6rem 0;
      border: none;
      border-bottom: 1px solid #D5D0CA;
      background: transparent;
      color: #2C2C2C;
      outline: none;
      transition: border-color 0.2s ease;
      min-height: 44px;
    }

    .input-group input:focus { border-bottom-color: #2C2C2C; }

    .log-btn-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 0.5rem;
    }

    /* History */
    .history-section {
      padding: 2rem 0 1rem;
    }

    .history-list { margin-top: 1rem; }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
      border-bottom: 1px solid #E8E4DF;
    }

    .history-date {
      font-size: 0.85rem;
      color: #2C2C2C;
      font-weight: 400;
    }

    .history-note {
      font-size: 0.75rem;
      color: #8A8478;
      margin-top: 0.15rem;
    }

    .history-duration {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 400;
      color: #2C2C2C;
      white-space: nowrap;
    }

    .history-empty {
      text-align: center;
      color: #8A8478;
      font-size: 0.85rem;
      padding: 2rem 0;
    }

    .history-item-right {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-left: 1rem;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #C4A68A;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0.3rem;
      font-family: 'DM Sans', sans-serif;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s ease;
    }

    .delete-btn:active { opacity: 0.5; }

    /* Bulk add */
    .bulk-section {
      padding: 2rem 0;
      border-bottom: 1px solid #E8E4DF;
      text-align: center;
    }

    .bulk-modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(44, 44, 44, 0.4);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .bulk-modal-overlay.open {
      display: flex;
    }

    .bulk-modal {
      background: #FAF8F5;
      border-radius: 12px;
      padding: 2rem 1.5rem;
      width: 100%;
      max-width: 420px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .bulk-modal h2 {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-size: 1.2rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .bulk-form {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .bulk-row {
      display: flex;
      gap: 1rem;
    }

    .bulk-row .input-group { flex: 1; }

    .bulk-preview {
      font-size: 0.8rem;
      color: #8A8478;
      text-align: center;
      padding: 0.8rem 0;
      letter-spacing: 0.03em;
    }

    .bulk-btn-row {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 0.5rem;
    }

    .photo-input { display: none; }

    /* History photo button */
    .history-photo-btn {
      background: none;
      border: none;
      color: #A3A88E;
      cursor: pointer;
      padding: 0.3rem;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s ease;
    }

    .history-photo-btn:active { opacity: 0.5; }

    .history-photo-btn svg {
      width: 16px;
      height: 16px;
      stroke-width: 1.5;
    }

    .history-photos {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.4rem;
      flex-wrap: wrap;
    }

    .history-thumb {
      width: 36px;
      height: 36px;
      border-radius: 4px;
      object-fit: cover;
    }

    /* Edit modal */
    .edit-modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(44, 44, 44, 0.4);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .edit-modal-overlay.open {
      display: flex;
    }

    .edit-modal {
      background: #FAF8F5;
      border-radius: 12px;
      padding: 2rem 1.5rem;
      width: 100%;
      max-width: 420px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .edit-modal h2 {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-size: 1.2rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .edit-form {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .edit-btn-row {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 0.5rem;
    }

    .history-item-left {
      flex: 1;
      min-width: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0.05);
    }

    .history-item-left:active {
      opacity: 0.6;
    }

    /* Back link */
    .back-link {
      display: inline-block;
      color: #8A8478;
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 1rem 1.5rem;
      transition: opacity 0.2s ease;
    }

    .back-link:active { opacity: 0.5; }

    /* Loading state */
    .loading-state {
      display: none;
      text-align: center;
      padding: 5rem 1.5rem;
    }

    .loading-spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #E8E4DF;
      border-top-color: #C5A46D;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 0.8rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #8A8478;
      font-weight: 400;
    }

    /* Sign-in prompt */
    .signin-prompt {
      text-align: center;
      padding: 4rem 1.5rem;
    }

    .signin-prompt-text {
      font-size: 0.85rem;
      color: #8A8478;
      letter-spacing: 0.08em;
    }

    /* Family members */
    .family-section {
      padding: 1.5rem 0;
      border-bottom: 1px solid #E8E4DF;
    }

    .family-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .family-members-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .family-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #F0EDE8;
      border: none;
      border-radius: 20px;
      padding: 0.4rem 0.8rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 400;
      color: #2C2C2C;
      letter-spacing: 0.03em;
    }

    .family-chip-remove {
      background: none;
      border: none;
      color: #C4A68A;
      font-size: 0.9rem;
      cursor: pointer;
      padding: 0 0.1rem;
      line-height: 1;
      min-width: 22px;
      min-height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .family-chip-remove:active { opacity: 0.5; }

    .family-add-btn {
      background: none;
      border: 1px dashed #D5D0CA;
      border-radius: 20px;
      padding: 0.4rem 0.8rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      color: #8A8478;
      cursor: pointer;
      min-height: 34px;
      transition: border-color 0.2s ease;
    }

    .family-add-btn:active { border-color: #8A8478; }

    .family-add-row {
      display: none;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.8rem;
    }

    .family-add-row.open { display: flex; }

    .family-add-row input {
      flex: 1;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 300;
      padding: 0.5rem 0;
      border: none;
      border-bottom: 1px solid #D5D0CA;
      background: transparent;
      color: #2C2C2C;
      outline: none;
      min-height: 44px;
    }

    .family-add-row input:focus { border-bottom-color: #2C2C2C; }

    .family-add-row .btn {
      min-width: auto;
      padding: 0.5rem 1rem;
      font-size: 0.65rem;
    }

    /* Member picker (in entry form) */
    .member-picker {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .member-picker-label {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #8A8478;
      font-weight: 400;
    }

    .member-picker-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .member-toggle {
      display: inline-flex;
      align-items: center;
      border: 1px solid #D5D0CA;
      border-radius: 20px;
      padding: 0.4rem 0.9rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.78rem;
      font-weight: 400;
      color: #8A8478;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 34px;
    }

    .member-toggle.selected {
      background: #2C2C2C;
      border-color: #2C2C2C;
      color: #FAF8F5;
    }

    .history-members {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
      margin-top: 0.2rem;

      font-size: 0.6rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #A3A88E;

      padding: 0.15rem 0.5rem;
      font-weight: 400;

<body>
  <header>
    <h1>Outdoor Hours</h1>
    <p>Time well spent</p>
  </header>

  <div class="container">
    <!-- Auth -->
    <div class="auth-section" id="authSection"></div>

    <!-- Sign-in prompt (shown when not signed in) -->
    <div class="signin-prompt" id="signinPrompt">
      <p class="signin-prompt-text">Sign in to track and see your hours</p>
    </div>

    <!-- Loading state (shown while data is loading) -->
    <div class="loading-state" id="loadingState">
      <div class="loading-spinner"></div>
      <div class="loading-text">Gathering...</div>
    </div>

    <!-- App content (hidden until signed in) -->
    <div id="appContent" style="display:none;">

    <!-- Total -->
    <div class="total-section">
      <div class="total-label">All Time Total</div>
      <div class="total-hours" id="totalDisplay">0<span> hrs</span></div>
      <div class="week-summary" id="weekSummary">0 hrs this week</div>
    </div>

    <!-- Family Members -->
    <div class="family-section">
      <div class="family-header">
        <div class="section-title" style="margin-bottom:0;">Family Members</div>
      </div>
      <div class="family-members-list" id="familyList"></div>
      <div class="family-add-row" id="familyAddRow">
        <input type="text" id="familyNameInput" placeholder="Name" maxlength="30">
        <button class="btn btn-primary" onclick="addFamilyMember()">Add</button>
        <button class="btn" onclick="closeFamilyAdd()">Cancel</button>
      </div>
    </div>

    <!-- Stopwatch -->
    <div class="stopwatch-section">
      <div class="section-title">Stopwatch</div>
      <div class="stopwatch-display" id="stopwatchDisplay">00:00:00</div>
      <div class="stopwatch-buttons">
        <button class="btn btn-primary" id="startStopBtn" onclick="toggleStopwatch()">Start</button>
        <button class="btn btn-save" id="saveBtn" onclick="saveStopwatch()" disabled>Save</button>
        <button class="btn btn-danger" id="resetBtn" onclick="resetStopwatch()" disabled>Reset</button>
      </div>
    </div>

    <!-- Log entry (hours + optional photo) -->
    <div class="log-section">
      <div class="section-title">New Entry</div>
      <div class="log-form">
        <div class="input-group">
          <label>Date</label>
          <input type="date" id="logDate">
        </div>
        <div class="input-group">
          <label>Hours</label>
          <input type="number" id="logHours" placeholder="e.g. 2.5" min="0" step="0.25">
        </div>
        <div class="input-group">
          <label>Note (optional)</label>
          <input type="text" id="logNote" placeholder="e.g. Park walk">
        </div>
        <div class="member-picker" id="entryMemberPicker"></div>
        <div class="log-btn-row">
          <button class="btn btn-primary" onclick="logPastHours()">Add Entry</button>
        </div>
        <div class="entry-photo-area">
          <div class="section-title" style="margin-bottom:0.8rem;">Capture a Moment</div>
          <div class="entry-photo-buttons" id="entryPhotoButtons">
            <button class="btn" onclick="document.getElementById('entryPhotoCameraInput').click()">Take Photo</button>
            <button class="btn" onclick="document.getElementById('entryPhotoLibraryInput').click()">From Library</button>
          </div>
          <input type="file" accept="image/*" capture="environment" id="entryPhotoCameraInput" class="photo-input" onchange="handleEntryPhotoSelect(event)">
          <input type="file" accept="image/*" id="entryPhotoLibraryInput" class="photo-input" onchange="handleEntryPhotoSelect(event)">
          <div class="entry-photo-preview" id="entryPhotoPreview">
            <img id="entryPhotoImg" src="" alt="Preview">
            <div class="entry-photo-caption input-group">
              <label>Caption (optional)</label>
              <input type="text" id="entryPhotoCaption" placeholder="e.g. Sunset at the lake">
            </div>
            <button class="entry-photo-remove" onclick="removeEntryPhoto()">Remove Photo</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bulk add -->
    <div class="bulk-section">
      <div class="section-title">Backfill Previous Months</div>
      <button class="btn" onclick="openBulkModal()">Bulk Add Hours</button>
    </div>

    <!-- Bulk modal -->
    <div class="bulk-modal-overlay" id="bulkOverlay" onclick="closeBulkModal(event)">
      <div class="bulk-modal" onclick="event.stopPropagation()">
        <h2>Bulk Add Hours</h2>
        <div class="bulk-form">
          <div class="bulk-row">
            <div class="input-group">
              <label>From Month</label>
              <input type="month" id="bulkFrom">
            </div>
            <div class="input-group">
              <label>To Month</label>
              <input type="month" id="bulkTo">
            </div>
          </div>
          <div class="input-group">
            <label>Hours per Month</label>
            <input type="number" id="bulkHours" placeholder="e.g. 20" min="0" step="0.25">
          </div>
          <div class="input-group">
            <label>Note (optional)</label>
            <input type="text" id="bulkNote" placeholder="e.g. Estimated outdoor time">
          </div>
          <div class="bulk-preview" id="bulkPreview"></div>
          <div class="bulk-btn-row">
            <button class="btn btn-danger" onclick="closeBulkModal()">Cancel</button>
            <button class="btn btn-primary" onclick="submitBulk()">Add All</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Edit entry modal -->
    <div class="edit-modal-overlay" id="editOverlay" onclick="closeEditModal(event)">
      <div class="edit-modal" onclick="event.stopPropagation()">
        <h2>Edit Entry</h2>
        <div class="edit-form">
          <div class="input-group">
            <label>Date</label>
            <input type="date" id="editDate">
          </div>
          <div class="input-group">
            <label>Hours</label>
            <input type="number" id="editHours" placeholder="e.g. 2.5" min="0" step="0.25">
          </div>
          <div class="input-group">
            <label>Note (optional)</label>
            <input type="text" id="editNote" placeholder="e.g. Park walk">
          </div>
          <div class="member-picker" id="editMemberPicker"></div>
          <div class="edit-btn-row">
            <button class="btn btn-danger" onclick="closeEditModal()">Cancel</button>
            <button class="btn btn-primary" onclick="saveEditEntry()">Save</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Hidden file input for adding photos from history items -->
    <input type="file" accept="image/*" id="photoEntryInput" class="photo-input" onchange="handlePhotoSelect(event)">
    <!-- Photo preview overlay for history-item photo additions -->
    <div class="edit-modal-overlay" id="photoOverlay" onclick="closePhotoOverlay(event)">
      <div class="edit-modal" onclick="event.stopPropagation()">
        <h2>Add Photo</h2>
        <div class="edit-form" style="align-items: center;">
          <img id="photoPreviewImg" style="width:100%;max-width:260px;border-radius:8px;" src="" alt="Preview">
          <div class="input-group" style="width:100%;">
            <label>Caption (optional)</label>
            <input type="text" id="photoCaption" placeholder="e.g. Sunset at the lake">
          </div>
          <div class="edit-btn-row">
            <button class="btn btn-danger" onclick="cancelPhoto()">Cancel</button>
            <button class="btn btn-primary" onclick="savePhoto()">Save</button>
          </div>
        </div>
      </div>
    </div>

    <!-- History -->
    <div class="history-section">
      <div class="section-title">History</div>
      <div class="history-list" id="historyList">
        <div class="history-empty">No entries yet</div>
      </div>
    </div>

    </div><!-- /appContent -->

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <a href="/sierra-apps/" class="nav-item">

      Home
    </a>

      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>

      Album
    </a>

  <script>
    // --- State ---
    let entries = [];
    let photos = [];
    let familyMembers = [];
    let pendingPhotoData = null;
    let pendingPhotoDate = null;
    let entryPhotoData = null;
    let stopwatchInterval = null;
    let stopwatchStartTime = null;
    let stopwatchElapsed = 0;
    let stopwatchRunning = false;
    let entrySelectedMembers = [];
    let editSelectedMembers = [];

    // --- Google Drive Storage (single source of truth) ---
    const storage = new GoogleDriveStorage('outdoor-hours-data.json');
    const photoStorage = new GoogleDriveStorage('outdoor-hours-photos.json');
    const familyStorage = new GoogleDriveStorage('outdoor-hours-family.json');

    // Inject shared auth styles
    document.getElementById('gds-styles').textContent = GoogleDriveStorage.getStyles();

    // Render auth UI
    storage.renderAuthUI(document.getElementById('authSection'), {
      onSignIn: async () => {
        // Try cached data first for instant render
        var cachedEntries = storage.getCachedData();
        var cachedPhotos = photoStorage.getCachedData();
        var cachedFamily = familyStorage.getCachedData();

        if (cachedEntries !== null) {
          entries = cachedEntries;
          photos = cachedPhotos || [];
          familyMembers = cachedFamily || [];
          document.getElementById('signinPrompt').style.display = 'none';
          document.getElementById('loadingState').style.display = 'none';
          document.getElementById('appContent').style.display = 'block';
          renderAll();

          var freshEntries = await storage.loadFromDrive();
          var freshPhotos = await photoStorage.loadFromDrive();
          var freshFamily = await familyStorage.loadFromDrive();
          if (freshEntries !== null) { entries = freshEntries; }
          if (freshPhotos !== null) { photos = freshPhotos; }
          if (freshFamily !== null) { familyMembers = freshFamily; }
          renderAll();
        } else {
          document.getElementById('signinPrompt').style.display = 'none';
          document.getElementById('appContent').style.display = 'none';
          document.getElementById('loadingState').style.display = 'block';

          entries = await storage.loadFromDrive() || [];
          photos = await photoStorage.loadFromDrive() || [];
          familyMembers = await familyStorage.loadFromDrive() || [];

          document.getElementById('loadingState').style.display = 'none';
          document.getElementById('appContent').style.display = 'block';
          renderAll();
        }
      },
      onSignOut: () => {
        entries = [];
        photos = [];
        familyMembers = [];
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('appContent').style.display = 'none';
        document.getElementById('signinPrompt').style.display = 'block';
      }
    });

    function saveData() {
      storage.save(entries);
    }

    // --- Stopwatch ---
    function toggleStopwatch() {
      if (stopwatchRunning) pauseStopwatch();
      else startStopwatch();
    }

    function startStopwatch() {
      stopwatchRunning = true;
      stopwatchStartTime = Date.now() - stopwatchElapsed;
      stopwatchInterval = setInterval(updateStopwatchDisplay, 100);
      document.getElementById('startStopBtn').textContent = 'Pause';
      document.getElementById('saveBtn').disabled = false;
      document.getElementById('resetBtn').disabled = false;
    }

    function pauseStopwatch() {
      stopwatchRunning = false;
      stopwatchElapsed = Date.now() - stopwatchStartTime;
      clearInterval(stopwatchInterval);
      document.getElementById('startStopBtn').textContent = 'Resume';
      document.getElementById('saveBtn').disabled = false;
      document.getElementById('resetBtn').disabled = false;
    }

    function resetStopwatch() {
      stopwatchRunning = false;
      stopwatchElapsed = 0;
      stopwatchStartTime = null;
      clearInterval(stopwatchInterval);
      document.getElementById('stopwatchDisplay').textContent = '00:00:00';
      document.getElementById('startStopBtn').textContent = 'Start';
      document.getElementById('saveBtn').disabled = true;
      document.getElementById('resetBtn').disabled = true;
    }

    function saveStopwatch() {
      const elapsed = stopwatchRunning
        ? Date.now() - stopwatchStartTime
        : stopwatchElapsed;

      if (elapsed < 1000) return;

      const hours = elapsed / 3600000;
      const today = new Date().toISOString().slice(0, 10);

      entries.unshift({
        id: Date.now(),
        date: today,
        hours: Math.round(hours * 100) / 100,
        note: 'Stopwatch',
        members: entrySelectedMembers.slice()
      });

      saveData();
      renderAll();
      resetStopwatch();
    }

    function updateStopwatchDisplay() {
      const elapsed = Date.now() - stopwatchStartTime;
      const totalSec = Math.floor(elapsed / 1000);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      document.getElementById('stopwatchDisplay').textContent =
        pad(h) + ':' + pad(m) + ':' + pad(s);
    }

    function pad(n) {
      return n.toString().padStart(2, '0');
    }

    // --- Log entry (hours + optional photo) ---
    function logPastHours() {
      const dateInput = document.getElementById('logDate');
      const hoursInput = document.getElementById('logHours');
      const noteInput = document.getElementById('logNote');

      const date = dateInput.value;
      const hours = parseFloat(hoursInput.value);

      if (!date || isNaN(hours) || hours <= 0) return;

      entries.unshift({
        id: Date.now(),
        date: date,
        hours: Math.round(hours * 100) / 100,
        note: noteInput.value.trim() || '',
        members: entrySelectedMembers.slice()
      });

      // Save attached photo if present
      if (entryPhotoData) {
        const caption = document.getElementById('entryPhotoCaption').value.trim();
        photos.unshift({
          id: Date.now() + Math.random(),
          date: date,
          dataUrl: entryPhotoData,
          caption: caption
        });
        photos.sort((a, b) => {
          if (a.date !== b.date) return b.date.localeCompare(a.date);
          return b.id - a.id;
        });
        photoStorage.save(photos);
        removeEntryPhoto();
      }

      saveData();
      renderAll();

      hoursInput.value = '';
      noteInput.value = '';
      entrySelectedMembers = [];
      renderMemberPicker('entryMemberPicker', entrySelectedMembers, 'entry');
    }

    // --- Entry photo helpers ---
    function handleEntryPhotoSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      resizeImage(file, 800, function(dataUrl) {
        entryPhotoData = dataUrl;
        document.getElementById('entryPhotoImg').src = dataUrl;
        document.getElementById('entryPhotoPreview').classList.add('has-photo');
        document.getElementById('entryPhotoButtons').style.display = 'none';
        document.getElementById('entryPhotoCaption').value = '';
      });
    }

    function removeEntryPhoto() {
      entryPhotoData = null;
      document.getElementById('entryPhotoPreview').classList.remove('has-photo');
      document.getElementById('entryPhotoButtons').style.display = 'flex';
      document.getElementById('entryPhotoCameraInput').value = '';
      document.getElementById('entryPhotoLibraryInput').value = '';
      document.getElementById('entryPhotoCaption').value = '';
    }

    // --- Delete ---
    function deleteEntry(id) {
      entries = entries.filter(e => e.id !== id);
      saveData();
      renderAll();
    }

    // --- Edit ---
    let editingEntryId = null;

    function editEntry(id) {
      const entry = entries.find(e => e.id === id);
      if (!entry) return;
      editingEntryId = id;
      document.getElementById('editDate').value = entry.date;
      document.getElementById('editHours').value = entry.hours;
      document.getElementById('editNote').value = entry.note || '';
      editSelectedMembers = (entry.members || []).slice();
      renderMemberPicker('editMemberPicker', editSelectedMembers, 'edit');
      document.getElementById('editOverlay').classList.add('open');
    }

    function closeEditModal(e) {
      if (e && e.target !== document.getElementById('editOverlay')) return;
      editingEntryId = null;
      document.getElementById('editOverlay').classList.remove('open');
    }

    function saveEditEntry() {
      const entry = entries.find(e => e.id === editingEntryId);
      if (!entry) return;

      const date = document.getElementById('editDate').value;
      const hours = parseFloat(document.getElementById('editHours').value);
      const note = document.getElementById('editNote').value.trim();

      if (!date || isNaN(hours) || hours <= 0) return;

      entry.date = date;
      entry.hours = Math.round(hours * 100) / 100;
      entry.note = note;
      entry.members = editSelectedMembers.slice();

      // Re-sort by date descending
      entries.sort((a, b) => {
        if (a.date !== b.date) return b.date.localeCompare(a.date);
        return b.id - a.id;
      });

      saveData();
      renderAll();
      editingEntryId = null;
      document.getElementById('editOverlay').classList.remove('open');
    }

    // --- Family members ---
    function renderFamilyList() {
      const list = document.getElementById('familyList');
      var html = familyMembers.map(function(name) {
        return '<span class="family-chip">' + escapeHtml(name) +
          '<button class="family-chip-remove" onclick="removeFamilyMember(\'' + escapeHtml(name).replace(/'/g, "\\'") + '\')">&times;</button></span>';
      }).join('');
      html += '<button class="family-add-btn" onclick="openFamilyAdd()">+ Add</button>';
      list.innerHTML = html;
    }

    function openFamilyAdd() {
      document.getElementById('familyAddRow').classList.add('open');
      document.getElementById('familyNameInput').value = '';
      document.getElementById('familyNameInput').focus();
    }

    function closeFamilyAdd() {
      document.getElementById('familyAddRow').classList.remove('open');
    }

    function addFamilyMember() {
      var name = document.getElementById('familyNameInput').value.trim();
      if (!name) return;
      if (familyMembers.some(function(m) { return m.toLowerCase() === name.toLowerCase(); })) return;
      familyMembers.push(name);
      familyStorage.save(familyMembers);
      closeFamilyAdd();
      renderAll();
    }

    function removeFamilyMember(name) {
      familyMembers = familyMembers.filter(function(m) { return m !== name; });
      familyStorage.save(familyMembers);
      renderAll();
    }

    // Enter key in family name input
    document.getElementById('familyNameInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); addFamilyMember(); }
    });

    // --- Member picker ---
    function renderMemberPicker(containerId, selectedArr, prefix) {
      var container = document.getElementById(containerId);
      if (familyMembers.length === 0) {
        container.innerHTML = '';
        return;
      }
      var html = '<div class="member-picker-label">Who was outside?</div><div class="member-picker-chips">';
      familyMembers.forEach(function(name) {
        var sel = selectedArr.indexOf(name) !== -1;
        html += '<button class="member-toggle' + (sel ? ' selected' : '') + '" onclick="toggleMember(\'' + escapeHtml(name).replace(/'/g, "\\'") + '\', \'' + prefix + '\')">' + escapeHtml(name) + '</button>';
      });
      html += '</div>';
      container.innerHTML = html;
    }

    function toggleMember(name, prefix) {
      var arr = prefix === 'entry' ? entrySelectedMembers : editSelectedMembers;
      var idx = arr.indexOf(name);
      if (idx === -1) arr.push(name);
      else arr.splice(idx, 1);
      renderMemberPicker(prefix === 'entry' ? 'entryMemberPicker' : 'editMemberPicker', arr, prefix);
    }

    // --- Rendering ---
    function renderAll() {
      renderFamilyList();
      renderMemberPicker('entryMemberPicker', entrySelectedMembers, 'entry');
      renderTotal();
      renderWeekSummary();
      renderHistory();
    }

    function renderTotal() {
      const total = entries.reduce((sum, e) => sum + e.hours, 0);
      const display = total < 10
        ? total.toFixed(1)
        : Math.round(total).toString();
      document.getElementById('totalDisplay').innerHTML =
        display + '<span> hrs</span>';
    }

    function renderWeekSummary() {
      const now = new Date();
      const dayOfWeek = now.getDay();
      const startOfWeek = new Date(now);
      startOfWeek.setDate(now.getDate() - dayOfWeek);
      startOfWeek.setHours(0, 0, 0, 0);
      const startStr = startOfWeek.toISOString().slice(0, 10);

      const weekTotal = entries
        .filter(e => e.date >= startStr)
        .reduce((sum, e) => sum + e.hours, 0);

      document.getElementById('weekSummary').textContent =
        (weekTotal < 10 ? weekTotal.toFixed(1) : Math.round(weekTotal)) + ' hrs this week';
    }

    function getPhotosForDate(date) {
      return photos.filter(p => p.date === date);
    }

    function renderHistory() {
      const list = document.getElementById('historyList');

      if (entries.length === 0) {
        list.innerHTML = '<div class="history-empty">No entries yet</div>';
        return;
      }

      list.innerHTML = entries.map(e => {
        const dateObj = new Date(e.date + 'T12:00:00');
        const formatted = dateObj.toLocaleDateString('en-US', {
          month: 'short', day: 'numeric', year: 'numeric'
        });
        const hoursStr = e.hours < 1
          ? Math.round(e.hours * 60) + ' min'
          : e.hours.toFixed(1) + ' hrs';
        const noteHtml = e.note
          ? '<div class="history-note">' + escapeHtml(e.note) + '</div>'
          : '';

        const membersHtml = (e.members && e.members.length > 0)
          ? '<div class="history-members">' +
              e.members.map(function(m) { return '<span class="history-member-tag">' + escapeHtml(m) + '</span>'; }).join('') +
            '</div>'
          : '';

        const datePhotos = getPhotosForDate(e.date);
        const thumbsHtml = datePhotos.length > 0
          ? '<div class="history-photos">' +
              datePhotos.map(p => '<img class="history-thumb" src="' + p.dataUrl + '" alt="">').join('') +
            '</div>'
          : '';

        return '<div class="history-item">' +
          '<div class="history-item-left" onclick="editEntry(' + e.id + ')">' +
            '<div class="history-date">' + formatted + '</div>' +
            noteHtml +
            membersHtml +
            thumbsHtml +
          '</div>' +
          '<div class="history-item-right">' +
            '<div class="history-duration">' + hoursStr + '</div>' +
            '<button class="history-photo-btn" onclick="addPhotoForDate(\'' + e.date + '\')" title="Add photo">' +
              '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>' +
            '</button>' +
            '<button class="delete-btn" onclick="deleteEntry(' + e.id + ')">&times;</button>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // --- Bulk add ---
    function openBulkModal() {
      const now = new Date();
      const lastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
      const formatMonth = d => d.toISOString().slice(0, 7);
      document.getElementById('bulkFrom').value = formatMonth(lastMonth);
      document.getElementById('bulkTo').value = formatMonth(lastMonth);
      document.getElementById('bulkHours').value = '';
      document.getElementById('bulkNote').value = '';
      updateBulkPreview();
      document.getElementById('bulkOverlay').classList.add('open');
    }

    function closeBulkModal(e) {
      if (e && e.target !== document.getElementById('bulkOverlay')) return;
      document.getElementById('bulkOverlay').classList.remove('open');
    }

    function getMonthsBetween(from, to) {
      const months = [];
      const [fy, fm] = from.split('-').map(Number);
      const [ty, tm] = to.split('-').map(Number);
      let y = fy, m = fm;
      while (y < ty || (y === ty && m <= tm)) {
        months.push({ year: y, month: m });
        m++;
        if (m > 12) { m = 1; y++; }
      }
      return months;
    }

    function updateBulkPreview() {
      const from = document.getElementById('bulkFrom').value;
      const to = document.getElementById('bulkTo').value;
      const hours = parseFloat(document.getElementById('bulkHours').value);
      const preview = document.getElementById('bulkPreview');

      if (!from || !to || from > to) {
        preview.textContent = '';
        return;
      }

      const months = getMonthsBetween(from, to);
      const count = months.length;
      const total = isNaN(hours) || hours <= 0 ? 0 : hours * count;
      preview.textContent = count + ' month' + (count !== 1 ? 's' : '') +
        (total > 0 ? ' — ' + total + ' hrs total' : '');
    }

    // Update preview when inputs change
    document.getElementById('bulkFrom').addEventListener('input', updateBulkPreview);
    document.getElementById('bulkTo').addEventListener('input', updateBulkPreview);
    document.getElementById('bulkHours').addEventListener('input', updateBulkPreview);

    function submitBulk() {
      const from = document.getElementById('bulkFrom').value;
      const to = document.getElementById('bulkTo').value;
      const hours = parseFloat(document.getElementById('bulkHours').value);
      const note = document.getElementById('bulkNote').value.trim();

      if (!from || !to || from > to) return;
      if (isNaN(hours) || hours <= 0) return;

      const months = getMonthsBetween(from, to);

      months.forEach(({ year, month }) => {
        // Use the 15th of each month as the entry date
        const date = year + '-' + String(month).padStart(2, '0') + '-15';
        entries.unshift({
          id: Date.now() + Math.random(),
          date: date,
          hours: Math.round(hours * 100) / 100,
          note: note || 'Bulk entry'
        });
      });

      // Sort entries by date descending
      entries.sort((a, b) => {
        if (a.date !== b.date) return b.date.localeCompare(a.date);
        return b.id - a.id;
      });

      saveData();
      renderAll();
      document.getElementById('bulkOverlay').classList.remove('open');
    }

    // --- Photo functions ---
    function resizeImage(file, maxWidth, callback) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let w = img.width, h = img.height;
          if (w > maxWidth) {
            h = Math.round(h * maxWidth / w);
            w = maxWidth;
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL('image/jpeg', 0.7));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function addPhotoForDate(date) {
      pendingPhotoDate = date;
      document.getElementById('photoEntryInput').click();
    }

    function handlePhotoSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      resizeImage(file, 800, function(dataUrl) {
        pendingPhotoData = dataUrl;
        document.getElementById('photoPreviewImg').src = dataUrl;
        document.getElementById('photoCaption').value = '';
        document.getElementById('photoOverlay').classList.add('open');
      });
    }

    function closePhotoOverlay(e) {
      if (e && e.target !== document.getElementById('photoOverlay')) return;
      cancelPhoto();
    }

    function cancelPhoto() {
      pendingPhotoData = null;
      document.getElementById('photoOverlay').classList.remove('open');
      document.getElementById('photoEntryInput').value = '';
    }

    function savePhoto() {
      if (!pendingPhotoData || !pendingPhotoDate) return;
      const caption = document.getElementById('photoCaption').value.trim();
      photos.unshift({
        id: Date.now() + Math.random(),
        date: pendingPhotoDate,
        dataUrl: pendingPhotoData,
        caption: caption
      });
      photos.sort((a, b) => {
        if (a.date !== b.date) return b.date.localeCompare(a.date);
        return b.id - a.id;
      });
      photoStorage.save(photos);
      pendingPhotoDate = null;
      cancelPhoto();
      renderHistory();
    }

    // --- Init ---
    (function init() {
      const today = new Date().toISOString().slice(0, 10);
      document.getElementById('logDate').value = today;
      // App content stays hidden until sign-in
    })();
  </script>
</body>
</html>

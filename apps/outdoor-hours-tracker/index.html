<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outdoor Hours</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      background: #FAF8F5;
      color: #2C2C2C;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    header {
      padding: 2.5rem 1.5rem 1.5rem;
      text-align: center;
      border-bottom: 1px solid #E8E4DF;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-size: 1.6rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    header p {
      color: #8A8478;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 400;
      margin-top: 0.3rem;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
    }

    /* Auth section */
    .auth-section {
      text-align: center;
      padding: 1.2rem 0;
      border-bottom: 1px solid #E8E4DF;
    }

    .auth-signed-out {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
    }

    .auth-signed-out .auth-hint {
      font-size: 0.7rem;
      color: #8A8478;
      letter-spacing: 0.1em;
    }

    .google-signin-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      border: 1px solid #D5D0CA;
      background: #FFFFFF;
      color: #2C2C2C;
      padding: 0.65rem 1.5rem;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 44px;
    }

    .google-signin-btn:active {
      background: #F5F3F0;
    }

    .google-signin-btn svg {
      width: 18px;
      height: 18px;
    }

    .auth-signed-in {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
    }

    .auth-user-info {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .auth-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
    }

    .auth-name {
      font-size: 0.75rem;
      color: #8A8478;
      letter-spacing: 0.05em;
    }

    .auth-signout-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: none;
      border: none;
      color: #C4A68A;
      cursor: pointer;
      padding: 0.3rem 0.5rem;
      min-height: 44px;
      display: flex;
      align-items: center;
      transition: opacity 0.2s ease;
    }

    .auth-signout-btn:active { opacity: 0.5; }

    .sync-status {
      font-size: 0.65rem;
      color: #A3A88E;
      letter-spacing: 0.08em;
      margin-top: 0.4rem;
    }

    .sync-status.error { color: #C4A68A; }

    /* Total summary */
    .total-section {
      text-align: center;
      padding: 2.5rem 0 2rem;
      border-bottom: 1px solid #E8E4DF;
    }

    .total-label {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #8A8478;
      font-weight: 400;
      margin-bottom: 0.5rem;
    }

    .total-hours {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: #2C2C2C;
    }

    .total-hours span {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 300;
      color: #8A8478;
      letter-spacing: 0.05em;
    }

    .week-summary {
      margin-top: 0.8rem;
      font-size: 0.8rem;
      color: #A3A88E;
      letter-spacing: 0.05em;
    }

    /* Stopwatch */
    .stopwatch-section {
      padding: 2rem 0;
      text-align: center;
      border-bottom: 1px solid #E8E4DF;
    }

    .section-title {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #8A8478;
      font-weight: 400;
      margin-bottom: 1.5rem;
    }

    .stopwatch-display {
      font-family: 'DM Sans', sans-serif;
      font-size: 2.8rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      color: #2C2C2C;
      margin-bottom: 1.5rem;
    }

    .stopwatch-buttons {
      display: flex;
      justify-content: center;
      gap: 1rem;
    }

    .btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      border: 1px solid #2C2C2C;
      background: transparent;
      color: #2C2C2C;
      padding: 0.75rem 2rem;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s ease;
      min-width: 120px;
      min-height: 44px;
    }

    .btn:active { opacity: 0.6; }

    .btn-primary {
      background: #2C2C2C;
      color: #FAF8F5;
    }

    .btn-primary:active { background: #444; }

    .btn-save {
      border-color: #A3A88E;
      color: #A3A88E;
    }

    .btn-save:active {
      background: #A3A88E;
      color: #FAF8F5;
    }

    .btn-danger {
      border-color: #C4A68A;
      color: #C4A68A;
    }

    .btn-danger:active {
      background: #C4A68A;
      color: #FAF8F5;
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    /* Log past hours */
    .log-section {
      padding: 2rem 0;
      border-bottom: 1px solid #E8E4DF;
    }

    .log-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .input-group label {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #8A8478;
      font-weight: 400;
    }

    .input-group input {
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 300;
      padding: 0.6rem 0;
      border: none;
      border-bottom: 1px solid #D5D0CA;
      background: transparent;
      color: #2C2C2C;
      outline: none;
      transition: border-color 0.2s ease;
      min-height: 44px;
    }

    .input-group input:focus { border-bottom-color: #2C2C2C; }

    .log-btn-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 0.5rem;
    }

    /* History */
    .history-section {
      padding: 2rem 0 1rem;
    }

    .history-list { margin-top: 1rem; }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
      border-bottom: 1px solid #E8E4DF;
    }

    .history-date {
      font-size: 0.85rem;
      color: #2C2C2C;
      font-weight: 400;
    }

    .history-note {
      font-size: 0.75rem;
      color: #8A8478;
      margin-top: 0.15rem;
    }

    .history-duration {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 400;
      color: #2C2C2C;
      white-space: nowrap;
    }

    .history-empty {
      text-align: center;
      color: #8A8478;
      font-size: 0.85rem;
      padding: 2rem 0;
    }

    .history-item-left {
      flex: 1;
      min-width: 0;
    }

    .history-item-right {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-left: 1rem;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #C4A68A;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0.3rem;
      font-family: 'DM Sans', sans-serif;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s ease;
    }

    .delete-btn:active { opacity: 0.5; }

    .clear-all-row {
      text-align: center;
      margin-top: 1.5rem;
    }

    .clear-all-btn {
      font-family: 'DM Sans', sans-serif;
      background: none;
      border: none;
      color: #C4A68A;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0.5rem 1rem;
      min-height: 44px;
      transition: opacity 0.2s ease;
    }

    .clear-all-btn:active { opacity: 0.5; }

    /* Back link */
    .back-link {
      display: inline-block;
      color: #8A8478;
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 1rem 1.5rem;
      transition: opacity 0.2s ease;
    }

    .back-link:active { opacity: 0.5; }
  </style>
</head>
<body>
  <a class="back-link" href="/sierra-apps/">&larr; Back</a>
  <header>
    <h1>Outdoor Hours</h1>
    <p>Time well spent</p>
  </header>

  <div class="container">
    <!-- Auth -->
    <div class="auth-section" id="authSection">
      <div class="auth-signed-out" id="authSignedOut">
        <button class="google-signin-btn" onclick="handleSignIn()">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Sign in with Google
        </button>
        <span class="auth-hint">Sync your data across devices</span>
      </div>
      <div class="auth-signed-in" id="authSignedIn" style="display:none;">
        <div class="auth-user-info">
          <img class="auth-avatar" id="authAvatar" src="" alt="">
          <span class="auth-name" id="authName"></span>
        </div>
        <button class="auth-signout-btn" onclick="handleSignOut()">Sign Out</button>
      </div>
      <div class="sync-status" id="syncStatus"></div>
    </div>

    <!-- Total -->
    <div class="total-section">
      <div class="total-label">All Time Total</div>
      <div class="total-hours" id="totalDisplay">0<span> hrs</span></div>
      <div class="week-summary" id="weekSummary">0 hrs this week</div>
    </div>

    <!-- Stopwatch -->
    <div class="stopwatch-section">
      <div class="section-title">Stopwatch</div>
      <div class="stopwatch-display" id="stopwatchDisplay">00:00:00</div>
      <div class="stopwatch-buttons">
        <button class="btn btn-primary" id="startStopBtn" onclick="toggleStopwatch()">Start</button>
        <button class="btn btn-save" id="saveBtn" onclick="saveStopwatch()" disabled>Save</button>
        <button class="btn btn-danger" id="resetBtn" onclick="resetStopwatch()" disabled>Reset</button>
      </div>
    </div>

    <!-- Log past hours -->
    <div class="log-section">
      <div class="section-title">Log Past Hours</div>
      <div class="log-form">
        <div class="input-group">
          <label>Date</label>
          <input type="date" id="logDate">
        </div>
        <div class="input-group">
          <label>Hours</label>
          <input type="number" id="logHours" placeholder="e.g. 2.5" min="0" step="0.25">
        </div>
        <div class="input-group">
          <label>Note (optional)</label>
          <input type="text" id="logNote" placeholder="e.g. Park walk">
        </div>
        <div class="log-btn-row">
          <button class="btn" onclick="logPastHours()">Add Entry</button>
        </div>
      </div>
    </div>

    <!-- History -->
    <div class="history-section">
      <div class="section-title">History</div>
      <div class="history-list" id="historyList">
        <div class="history-empty">No entries yet</div>
      </div>
      <div class="clear-all-row" id="clearAllRow" style="display:none;">
        <button class="clear-all-btn" onclick="clearAll()">Clear All History</button>
      </div>
    </div>
  </div>

  <script>
    // =============================================
    // CONFIG — Replace with your Google OAuth Client ID
    // =============================================
    const GOOGLE_CLIENT_ID = 'YOUR_CLIENT_ID_HERE';
    const DRIVE_FILE_NAME = 'outdoor-hours-data.json';
    const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';

    // --- State ---
    const STORAGE_KEY = 'outdoor-hours-data';
    let entries = [];
    let stopwatchInterval = null;
    let stopwatchStartTime = null;
    let stopwatchElapsed = 0;
    let stopwatchRunning = false;

    // Google auth state
    let tokenClient = null;
    let accessToken = null;
    let driveFileId = null;
    let currentUser = null;
    let isSyncing = false;

    // =============================================
    // Google Auth
    // =============================================
    function initGoogleAuth() {
      if (typeof google === 'undefined' || !google.accounts) {
        // GIS library not loaded yet, retry
        setTimeout(initGoogleAuth, 200);
        return;
      }

      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: DRIVE_SCOPE + ' https://www.googleapis.com/auth/userinfo.profile',
        callback: handleTokenResponse,
      });

      // Check if we have a cached session
      const cached = localStorage.getItem('outdoor-hours-user');
      if (cached) {
        try {
          currentUser = JSON.parse(cached);
          showSignedIn();
          // Silently try to get a new token
          tokenClient.requestAccessToken({ prompt: '' });
        } catch (e) {
          localStorage.removeItem('outdoor-hours-user');
        }
      }
    }

    function handleSignIn() {
      if (!tokenClient) {
        setSyncStatus('Google Sign-In not ready. Please wait...', true);
        return;
      }
      tokenClient.requestAccessToken({ prompt: 'consent' });
    }

    function handleTokenResponse(response) {
      if (response.error) {
        // User cancelled or error — if we had a cached session, clear it
        if (response.error === 'access_denied') {
          handleSignOut();
        }
        return;
      }

      accessToken = response.access_token;

      // Fetch user profile
      fetch('https://www.googleapis.com/oauth2/v2/userinfo', {
        headers: { Authorization: 'Bearer ' + accessToken }
      })
      .then(r => r.json())
      .then(profile => {
        currentUser = {
          name: profile.given_name || profile.name,
          picture: profile.picture
        };
        localStorage.setItem('outdoor-hours-user', JSON.stringify(currentUser));
        showSignedIn();
        syncFromDrive();
      })
      .catch(() => {
        setSyncStatus('Could not fetch profile', true);
      });
    }

    function handleSignOut() {
      if (accessToken) {
        google.accounts.oauth2.revoke(accessToken);
      }
      accessToken = null;
      driveFileId = null;
      currentUser = null;
      localStorage.removeItem('outdoor-hours-user');
      showSignedOut();
      setSyncStatus('');
    }

    function showSignedIn() {
      document.getElementById('authSignedOut').style.display = 'none';
      document.getElementById('authSignedIn').style.display = 'flex';
      if (currentUser) {
        document.getElementById('authName').textContent = currentUser.name;
        if (currentUser.picture) {
          document.getElementById('authAvatar').src = currentUser.picture;
          document.getElementById('authAvatar').style.display = 'block';
        } else {
          document.getElementById('authAvatar').style.display = 'none';
        }
      }
    }

    function showSignedOut() {
      document.getElementById('authSignedOut').style.display = 'flex';
      document.getElementById('authSignedIn').style.display = 'none';
    }

    function setSyncStatus(msg, isError) {
      const el = document.getElementById('syncStatus');
      el.textContent = msg;
      el.className = 'sync-status' + (isError ? ' error' : '');
    }

    // =============================================
    // Google Drive API
    // =============================================
    function driveRequest(url, options) {
      options = options || {};
      options.headers = options.headers || {};
      options.headers['Authorization'] = 'Bearer ' + accessToken;
      return fetch(url, options).then(r => {
        if (r.status === 401) {
          // Token expired — try silent refresh
          return new Promise((resolve, reject) => {
            tokenClient.requestAccessToken({ prompt: '' });
            // Wait a bit for the callback
            const check = setInterval(() => {
              if (accessToken) {
                clearInterval(check);
                options.headers['Authorization'] = 'Bearer ' + accessToken;
                resolve(fetch(url, options));
              }
            }, 500);
            setTimeout(() => { clearInterval(check); reject(new Error('Token refresh timeout')); }, 10000);
          });
        }
        return r;
      });
    }

    async function findDriveFile() {
      const query = encodeURIComponent("name='" + DRIVE_FILE_NAME + "' and trashed=false");
      const res = await driveRequest(
        'https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=' + query + '&fields=files(id,name)'
      );
      const data = await res.json();
      if (data.files && data.files.length > 0) {
        return data.files[0].id;
      }
      return null;
    }

    async function readDriveFile(fileId) {
      const res = await driveRequest(
        'https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media'
      );
      return res.json();
    }

    async function createDriveFile(data) {
      const metadata = {
        name: DRIVE_FILE_NAME,
        parents: ['appDataFolder']
      };

      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
      form.append('file', new Blob([JSON.stringify(data)], { type: 'application/json' }));

      const res = await driveRequest(
        'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',
        { method: 'POST', body: form }
      );
      const result = await res.json();
      return result.id;
    }

    async function updateDriveFile(fileId, data) {
      await driveRequest(
        'https://www.googleapis.com/upload/drive/v3/files/' + fileId + '?uploadType=media',
        {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        }
      );
    }

    // =============================================
    // Sync Logic
    // =============================================
    async function syncFromDrive() {
      if (!accessToken || isSyncing) return;
      isSyncing = true;
      setSyncStatus('Syncing...');

      try {
        driveFileId = await findDriveFile();

        if (driveFileId) {
          const driveData = await readDriveFile(driveFileId);
          if (Array.isArray(driveData)) {
            // Merge: combine local and remote, deduplicate by id
            const merged = mergeEntries(entries, driveData);
            entries = merged;
            saveLocal();
            renderAll();
            // Push merged back to Drive
            await updateDriveFile(driveFileId, entries);
          }
          setSyncStatus('Synced with Google Drive');
        } else {
          // No file on Drive yet — upload local data
          if (entries.length > 0) {
            driveFileId = await createDriveFile(entries);
            setSyncStatus('Synced with Google Drive');
          } else {
            setSyncStatus('Connected to Google Drive');
          }
        }
      } catch (e) {
        console.error('Drive sync error:', e);
        setSyncStatus('Sync failed — using local data', true);
      }

      isSyncing = false;
    }

    async function syncToDrive() {
      if (!accessToken || isSyncing) return;
      isSyncing = true;

      try {
        if (driveFileId) {
          await updateDriveFile(driveFileId, entries);
        } else {
          driveFileId = await createDriveFile(entries);
        }
        setSyncStatus('Synced with Google Drive');
      } catch (e) {
        console.error('Drive save error:', e);
        setSyncStatus('Sync failed — saved locally', true);
      }

      isSyncing = false;
    }

    function mergeEntries(local, remote) {
      const map = new Map();
      // Remote entries first, then local overrides
      remote.forEach(e => map.set(e.id, e));
      local.forEach(e => map.set(e.id, e));
      // Sort newest first by date, then by id
      return Array.from(map.values()).sort((a, b) => {
        if (a.date !== b.date) return b.date.localeCompare(a.date);
        return b.id - a.id;
      });
    }

    // =============================================
    // Local Persistence
    // =============================================
    function loadLocal() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) entries = JSON.parse(raw);
      } catch (e) {
        entries = [];
      }
    }

    function saveLocal() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }

    function saveData() {
      saveLocal();
      syncToDrive();
    }

    // =============================================
    // Stopwatch
    // =============================================
    function toggleStopwatch() {
      if (stopwatchRunning) {
        pauseStopwatch();
      } else {
        startStopwatch();
      }
    }

    function startStopwatch() {
      stopwatchRunning = true;
      stopwatchStartTime = Date.now() - stopwatchElapsed;
      stopwatchInterval = setInterval(updateStopwatchDisplay, 100);
      document.getElementById('startStopBtn').textContent = 'Pause';
      document.getElementById('saveBtn').disabled = false;
      document.getElementById('resetBtn').disabled = false;
    }

    function pauseStopwatch() {
      stopwatchRunning = false;
      stopwatchElapsed = Date.now() - stopwatchStartTime;
      clearInterval(stopwatchInterval);
      document.getElementById('startStopBtn').textContent = 'Resume';
      document.getElementById('saveBtn').disabled = false;
      document.getElementById('resetBtn').disabled = false;
    }

    function resetStopwatch() {
      stopwatchRunning = false;
      stopwatchElapsed = 0;
      stopwatchStartTime = null;
      clearInterval(stopwatchInterval);
      document.getElementById('stopwatchDisplay').textContent = '00:00:00';
      document.getElementById('startStopBtn').textContent = 'Start';
      document.getElementById('saveBtn').disabled = true;
      document.getElementById('resetBtn').disabled = true;
    }

    function saveStopwatch() {
      const elapsed = stopwatchRunning
        ? Date.now() - stopwatchStartTime
        : stopwatchElapsed;

      if (elapsed < 1000) return;

      const hours = elapsed / 3600000;
      const today = new Date().toISOString().slice(0, 10);

      entries.unshift({
        id: Date.now(),
        date: today,
        hours: Math.round(hours * 100) / 100,
        note: 'Stopwatch'
      });

      saveData();
      renderAll();
      resetStopwatch();
    }

    function updateStopwatchDisplay() {
      const elapsed = Date.now() - stopwatchStartTime;
      const totalSec = Math.floor(elapsed / 1000);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      document.getElementById('stopwatchDisplay').textContent =
        pad(h) + ':' + pad(m) + ':' + pad(s);
    }

    function pad(n) {
      return n.toString().padStart(2, '0');
    }

    // =============================================
    // Log past hours
    // =============================================
    function logPastHours() {
      const dateInput = document.getElementById('logDate');
      const hoursInput = document.getElementById('logHours');
      const noteInput = document.getElementById('logNote');

      const date = dateInput.value;
      const hours = parseFloat(hoursInput.value);

      if (!date || isNaN(hours) || hours <= 0) return;

      entries.unshift({
        id: Date.now(),
        date: date,
        hours: Math.round(hours * 100) / 100,
        note: noteInput.value.trim() || ''
      });

      saveData();
      renderAll();

      hoursInput.value = '';
      noteInput.value = '';
    }

    // =============================================
    // Delete
    // =============================================
    function deleteEntry(id) {
      entries = entries.filter(e => e.id !== id);
      saveData();
      renderAll();
    }

    function clearAll() {
      if (confirm('Clear all history? This cannot be undone.')) {
        entries = [];
        saveData();
        renderAll();
      }
    }

    // =============================================
    // Rendering
    // =============================================
    function renderAll() {
      renderTotal();
      renderWeekSummary();
      renderHistory();
    }

    function renderTotal() {
      const total = entries.reduce((sum, e) => sum + e.hours, 0);
      const display = total < 10
        ? total.toFixed(1)
        : Math.round(total).toString();
      document.getElementById('totalDisplay').innerHTML =
        display + '<span> hrs</span>';
    }

    function renderWeekSummary() {
      const now = new Date();
      const dayOfWeek = now.getDay();
      const startOfWeek = new Date(now);
      startOfWeek.setDate(now.getDate() - dayOfWeek);
      startOfWeek.setHours(0, 0, 0, 0);
      const startStr = startOfWeek.toISOString().slice(0, 10);

      const weekTotal = entries
        .filter(e => e.date >= startStr)
        .reduce((sum, e) => sum + e.hours, 0);

      document.getElementById('weekSummary').textContent =
        (weekTotal < 10 ? weekTotal.toFixed(1) : Math.round(weekTotal)) + ' hrs this week';
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      const clearRow = document.getElementById('clearAllRow');

      if (entries.length === 0) {
        list.innerHTML = '<div class="history-empty">No entries yet</div>';
        clearRow.style.display = 'none';
        return;
      }

      clearRow.style.display = 'block';

      list.innerHTML = entries.map(e => {
        const dateObj = new Date(e.date + 'T12:00:00');
        const formatted = dateObj.toLocaleDateString('en-US', {
          month: 'short', day: 'numeric', year: 'numeric'
        });
        const hoursStr = e.hours < 1
          ? Math.round(e.hours * 60) + ' min'
          : e.hours.toFixed(1) + ' hrs';
        const noteHtml = e.note
          ? '<div class="history-note">' + escapeHtml(e.note) + '</div>'
          : '';

        return '<div class="history-item">' +
          '<div class="history-item-left">' +
            '<div class="history-date">' + formatted + '</div>' +
            noteHtml +
          '</div>' +
          '<div class="history-item-right">' +
            '<div class="history-duration">' + hoursStr + '</div>' +
            '<button class="delete-btn" onclick="deleteEntry(' + e.id + ')">&times;</button>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // =============================================
    // Init
    // =============================================
    (function init() {
      const today = new Date().toISOString().slice(0, 10);
      document.getElementById('logDate').value = today;

      loadLocal();
      renderAll();
      initGoogleAuth();
    })();
  </script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Cream background -->
  <rect width="180" height="180" rx="36" fill="#FAF8F5"/>
  <!-- Sun rays -->
  <g stroke="#F6E6A0" stroke-width="3.5" stroke-linecap="round">
    <line x1="90" y1="22" x2="90" y2="34"/>
    <line x1="90" y1="142" x2="90" y2="154"/>
    <line x1="24" y1="88" x2="36" y2="88"/>
    <line x1="144" y1="88" x2="156" y2="88"/>
    <line x1="43.3" y1="41.3" x2="51.8" y2="49.8"/>
    <line x1="128.2" y1="126.2" x2="136.7" y2="134.7"/>
    <line x1="136.7" y1="41.3" x2="128.2" y2="49.8"/>
    <line x1="51.8" y1="126.2" x2="43.3" y2="134.7"/>
    <line x1="33.5" y1="57" x2="44" y2="63"/>
    <line x1="136" y1="113" x2="146.5" y2="119"/>
    <line x1="146.5" y1="57" x2="136" y2="63"/>
    <line x1="44" y1="113" x2="33.5" y2="119"/>
  </g>
  <!-- Sun body -->
  <circle cx="90" cy="88" r="42" fill="#F6E6A0"/>
  <!-- Closed happy eyes -->
  <path d="M70,83 Q77,76 84,83" fill="none" stroke="#8A7A60" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M96,83 Q103,76 110,83" fill="none" stroke="#8A7A60" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Happy smile -->
  <path d="M76,95 Q90,110 104,95" fill="none" stroke="#8A7A60" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Rosy cheeks -->
  <circle cx="68" cy="96" r="7" fill="rgba(212,170,140,0.35)"/>
  <circle cx="112" cy="96" r="7" fill="rgba(212,170,140,0.35)"/>
  <!-- Text -->
  <text x="90" y="155" text-anchor="middle" fill="#8A8478" font-family="sans-serif" font-size="11" font-weight="300" letter-spacing="0.1em">TIME WELL SPENT</text>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sierra Apps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      background: #FAF8F5;
      color: #2C2C2C;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    header {
      padding: 3.5rem 1.5rem 2rem;
      text-align: center;
      border-bottom: 1px solid #E8E4DF;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-size: 2rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    header p {
      color: #8A8478;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 400;
    }

    .apps {
      max-width: 500px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .app-card {
      display: block;
      padding: 1.5rem 0;
      text-decoration: none;
      color: inherit;
      border-bottom: 1px solid #E8E4DF;
      transition: opacity 0.2s ease;
    }

    .app-card:active { opacity: 0.6; }

    .app-card h2 {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-size: 1.15rem;
      letter-spacing: 0.03em;
      margin-bottom: 0.35rem;
    }

    .app-card p {
      color: #8A8478;
      font-size: 0.85rem;
      font-weight: 300;
      line-height: 1.5;
    }

    .app-card .arrow {
      display: inline-block;
      color: #C5A46D;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: 0.6rem;
      font-weight: 400;
    }

    .empty {
      text-align: center;
      color: #8A8478;
      padding: 4rem 1rem;
      font-size: 0.95rem;
      line-height: 1.8;
      letter-spacing: 0.02em;
    }

    .empty span {
      display: block;
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      color: #2C2C2C;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Sierra</h1>
    <p>Our Collection</p>
  </header>
  <div class="apps">
    <div class="empty">
      <span>Nothing here yet</span>
      Ask Claude to build something beautiful.
    </div>
    <!-- When adding a new app, add a card here like:
    <a class="app-card" href="apps/my-app/">
      <h2>My App</h2>
      <p>A short description of what it does.</p>
      <span class="arrow">Open &rarr;</span>
    </a>
    -->
  </div>
</body>
</html>
